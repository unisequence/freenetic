name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run syntax, policy and unit checks
        run: make check-static

  openwrt-packages:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenWrt 24.10.8 mediatek/filogic (IPK)
            release: 24.10.8
            target: mediatek
            subtarget: filogic
            format: ipk
            cli_target: filogic
            asset_arch: aarch64_cortex-a53
            include_fnc: true
            publish_packages: true
            sdk_archive: openwrt-sdk-24.10.8-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: d9fd074f281823a3023e8f6a73aaac598018c898ec9ac4d1c507b596930d7482
          - name: OpenWrt 24.10.8 ramips/mt7621 (IPK + fnc)
            release: 24.10.8
            target: ramips
            subtarget: mt7621
            format: ipk
            cli_target: mt7621
            asset_arch: mipsel_24kc
            include_fnc: true
            publish_packages: false
            sdk_archive: openwrt-sdk-24.10.8-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 9dd11b0517883b016ad7684f5c408a3483eec5b2455b2ffe004c9edd84063e45
          - name: OpenWrt 25.12.5 mediatek/filogic (APK)
            release: 25.12.5
            target: mediatek
            subtarget: filogic
            format: apk
            cli_target: filogic
            asset_arch: aarch64_cortex-a53
            include_fnc: true
            publish_packages: true
            sdk_archive: openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25
          - name: OpenWrt 25.12.5 ramips/mt7621 (APK + fnc)
            release: 25.12.5
            target: ramips
            subtarget: mt7621
            format: apk
            cli_target: mt7621
            asset_arch: mipsel_24kc
            include_fnc: true
            publish_packages: false
            sdk_archive: openwrt-sdk-25.12.5-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 9962084f4131610e90e48bc864c6ceade0b238f15f335de5f672910532b20e9c
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Package revisions are derived from the latest relevant source
          # commit; a shallow checkout would incorrectly report HEAD.
          fetch-depth: 0

      - name: Download and verify the OpenWrt SDK
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
          SDK_URL: https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/${{ matrix.target }}/${{ matrix.subtarget }}/${{ matrix.sdk_archive }}
          SDK_ARCHIVE: ${{ matrix.sdk_archive }}
          SDK_SHA256: ${{ matrix.sdk_sha256 }}
        run: |
          set -eu
          sdk_parent="$RUNNER_TEMP/freenetic-sdk"
          mkdir -p "$sdk_parent"
          curl --fail --location --retry 3 --output "$sdk_parent/$SDK_ARCHIVE" "$SDK_URL"
          printf '%s  %s\n' "$SDK_SHA256" "$sdk_parent/$SDK_ARCHIVE" | sha256sum --check --status
          tar --use-compress-program=unzstd -xf "$sdk_parent/$SDK_ARCHIVE" -C "$sdk_parent"
          sdk_dir="$(find "$sdk_parent" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$sdk_dir"
          ln -s "$GITHUB_WORKSPACE/app/luci-theme-freenetic" "$sdk_dir/package/luci-theme-freenetic"
          ln -s "$GITHUB_WORKSPACE/app/luci-app-freenetic" "$sdk_dir/package/luci-app-freenetic"
          make -C "$sdk_dir" defconfig
          # The SDK contains the toolchain, but not the base feed sources
          # needed to provide libubus/libuci headers and target libraries for
          # the fnc cross-build.
          "$sdk_dir/scripts/feeds" update base
          "$sdk_dir/scripts/feeds" update luci
          "$sdk_dir/scripts/feeds" install libjson-c libubox libubus libuci libblobmsg-json
          "$sdk_dir/scripts/feeds" install -a -p luci
          make -C "$sdk_dir" package/luci-base/host/compile
          if test "$PACKAGE_FORMAT" = ipk; then
            "$sdk_dir/staging_dir/host/bin/usign" -G \
              -s "$sdk_dir/key-build" -p "$sdk_dir/key-build.pub" \
              -c "Freenetic CI"
          else
            openssl ecparam -name prime256v1 -genkey -noout -out "$sdk_dir/private-key.pem"
            openssl ec -in "$sdk_dir/private-key.pem" -pubout -out "$sdk_dir/public-key.pem"
          fi
          echo "SDK_DIR=$sdk_dir" >> "$GITHUB_ENV"

      - name: Build packages and fnc
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
          CLI_TARGET: ${{ matrix.cli_target }}
        run: |
          set -eu
          make -C "$SDK_DIR" \
            CONFIG_PACKAGE_libjson-c=m CONFIG_PACKAGE_libubox=m CONFIG_PACKAGE_libblobmsg-json=m \
            CONFIG_PACKAGE_libubus=m CONFIG_PACKAGE_libuci=m \
            package/feeds/base/libjson-c/host/compile \
            package/feeds/base/libjson-c/compile \
            package/feeds/base/libubox/compile \
            package/feeds/base/ubus/compile \
            package/feeds/base/uci/compile
          make check-package OPENWRT_DIR="$SDK_DIR" DL_DIR="$SDK_DIR/dl" \
            FREENETIC_PACKAGE_FORMAT="$PACKAGE_FORMAT"
          if test "$PACKAGE_FORMAT" = apk; then
            key_dir="$RUNNER_TEMP/freenetic-apk-keys"
            mkdir -p "$key_dir"
            cp "$SDK_DIR/public-key.pem" "$key_dir/freenetic-release.pem"
            # SDK preparation can create its own transient build key before
            # our release key is installed. Re-sign the final payloads
            # explicitly so the exported public key is always the signer.
            # allow-untrusted applies only while replacing the SDK signature;
            # the immediately following verification is deliberately strict.
            find "$SDK_DIR/bin" -type f -name '*freenetic*.apk' -print0 | \
              xargs -0 -r -n1 "$SDK_DIR/staging_dir/host/bin/apk" \
                --allow-untrusted adbsign \
                --reset-signatures --sign-key "$SDK_DIR/private-key.pem"
            find "$SDK_DIR/bin" -type f -name '*freenetic*.apk' -print0 | \
              xargs -0 -r "$SDK_DIR/staging_dir/host/bin/apk" \
                --keys-dir "$key_dir" verify
          fi
          make -C "$SDK_DIR" package/index
          make check-package-index OPENWRT_DIR="$SDK_DIR"
          make -C cli OPENWRT_DIR="$SDK_DIR" FREENETIC_TARGET="$CLI_TARGET" -B

      - name: Prepare release assets
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          INCLUDE_FNC: ${{ matrix.include_fnc }}
          PUBLISH_PACKAGES: ${{ matrix.publish_packages }}
        run: |
          set -eu
          release_dir="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$release_dir"

          app_archive="$(find "$SDK_DIR/bin" -type f \( \
            -name 'luci-app-freenetic-*.apk' -o \
            -name 'luci-app-freenetic_*.ipk' \
          \) -print | sort -V | tail -n 1)"
          test -n "$app_archive"
          app_filename="${app_archive##*/}"
          case "$PACKAGE_FORMAT" in
            apk)
              asset_version="${app_filename#luci-app-freenetic-}"
              asset_version="${asset_version%.apk}"
              ;;
            ipk)
              asset_version="${app_filename#luci-app-freenetic_}"
              asset_version="${asset_version%_all.ipk}"
              ;;
            *)
              echo "Unsupported package format: $PACKAGE_FORMAT" >&2
              exit 1
              ;;
          esac
          asset_version="${asset_version//\~/.}"
          test -n "$asset_version"

          if [ "$PUBLISH_PACKAGES" = true ]; then
            for package in \
              luci-theme-freenetic \
              luci-app-freenetic \
              luci-i18n-theme-freenetic-ru \
              luci-i18n-freenetic-ru; do
              if [ "$PACKAGE_FORMAT" = apk ]; then
                archive="$(find "$SDK_DIR/bin" -type f -name "$package-*.apk" -print | sort -V | tail -n 1)"
                target_name="$package-$asset_version-$ASSET_ARCH.apk"
              else
                archive="$(find "$SDK_DIR/bin" -type f -name "${package}_*.ipk" -print | sort -V | tail -n 1)"
                target_name="$package-$asset_version-all.ipk"
              fi
              test -n "$archive"
              cp -f "$archive" "$release_dir/$target_name"
            done
            if [ "$PACKAGE_FORMAT" = apk ]; then
              cp -f "$SDK_DIR/public-key.pem" \
                "$release_dir/freenetic-apk-release-key-$asset_version.pem"
            fi
          fi

          if [ "$INCLUDE_FNC" = true ]; then
            cp -f "$GITHUB_WORKSPACE/cli/fnc" "$release_dir/fnc-$asset_version-$ASSET_ARCH-$PACKAGE_FORMAT"
          fi

          printf '%s\n' "$asset_version" > "$release_dir/ASSET_VERSION"
          find "$release_dir" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload verified Freenetic packages
        uses: actions/upload-artifact@v4
        with:
          name: freenetic-${{ matrix.target }}-${{ matrix.subtarget }}-${{ matrix.format }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/freenetic-sdk/**/bin/packages/**/base/*freenetic*
            ${{ runner.temp }}/freenetic-sdk/**/bin/packages/**/base/index.json
            ${{ runner.temp }}/freenetic-sdk/**/bin/targets/**/packages/*freenetic*
            ${{ runner.temp }}/freenetic-sdk/**/bin/targets/**/packages/index.json
            ${{ github.workspace }}/release-assets/*

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [static, openwrt-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable annotated release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # actions/checkout resolves an annotated tag to its commit and then
          # replaces the local tag ref with that commit. Fetch the remote tag
          # object into FETCH_HEAD so its type and target can still be checked
          # without rewriting the published ref.
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t FETCH_HEAD)" = tag
          test "$(git rev-list -n 1 FETCH_HEAD)" = "$(git rev-parse HEAD)"

      - name: Download 24.10 mediatek IPK build
        uses: actions/download-artifact@v4
        with:
          name: freenetic-mediatek-filogic-ipk
          path: artifacts/mediatek-filogic-ipk

      - name: Download 24.10 MT7621 fnc build
        uses: actions/download-artifact@v4
        with:
          name: freenetic-ramips-mt7621-ipk
          path: artifacts/ramips-mt7621-ipk

      - name: Download 25.12 APK build
        uses: actions/download-artifact@v4
        with:
          name: freenetic-mediatek-filogic-apk
          path: artifacts/mediatek-filogic-apk

      - name: Download 25.12 MT7621 fnc build
        uses: actions/download-artifact@v4
        with:
          name: freenetic-ramips-mt7621-apk
          path: artifacts/ramips-mt7621-apk

      - name: Assemble and validate release assets
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          release_dir="$RUNNER_TEMP/freenetic-release"
          mkdir -p "$release_dir"

          versions="$(find artifacts -type f -name ASSET_VERSION -exec cat {} \; | sort -u)"
          test "$(printf '%s\n' "$versions" | sed '/^$/d' | wc -l)" -eq 1
          asset_version="$(printf '%s\n' "$versions" | sed -n '1p')"
          test -n "$asset_version"

          find artifacts -type f -path '*/release-assets/*' ! -name ASSET_VERSION \
            -exec cp -f {} "$release_dir/" \;

          for package in \
            luci-theme-freenetic \
            luci-app-freenetic \
            luci-i18n-theme-freenetic-ru \
            luci-i18n-freenetic-ru; do
            source="$release_dir/$package-$asset_version-aarch64_cortex-a53.apk"
            test -f "$source"
            cp -f "$source" "$release_dir/$package-$asset_version-mipsel_24kc.apk"
            test -f "$release_dir/$package-$asset_version-all.ipk"
          done
          test -f "$release_dir/fnc-$asset_version-aarch64_cortex-a53-apk"
          test -f "$release_dir/fnc-$asset_version-aarch64_cortex-a53-ipk"
          test -f "$release_dir/fnc-$asset_version-mipsel_24kc-apk"
          test -f "$release_dir/fnc-$asset_version-mipsel_24kc-ipk"
          # Keep the old architecture-only names so routers running the
          # pre-0.2.6 dashboard can discover this release. The generated
          # installer itself always selects the manager-specific asset.
          cp -f "$release_dir/fnc-$asset_version-aarch64_cortex-a53-apk" \
            "$release_dir/fnc-$asset_version-aarch64_cortex-a53"
          cp -f "$release_dir/fnc-$asset_version-mipsel_24kc-ipk" \
            "$release_dir/fnc-$asset_version-mipsel_24kc"
          test -s "$release_dir/fnc-$asset_version-aarch64_cortex-a53"
          test -s "$release_dir/fnc-$asset_version-mipsel_24kc"

          notes_file="$RUNNER_TEMP/freenetic-release-notes.md"
          node app/prepare-release.js \
            "$release_dir" \
            "$GITHUB_WORKSPACE/install.sh" \
            "$GITHUB_WORKSPACE/docs/CHANGELOG.md" \
            "$notes_file" \
            "$RELEASE_TAG" \
            "$asset_version"

          asset_count="$(find "$release_dir" -maxdepth 1 -type f | wc -l)"
          test "$asset_count" -eq 21
          echo "asset_version=$asset_version" >> "$GITHUB_OUTPUT"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "release_notes=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.release.outputs.release_dir }}/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ steps.release.outputs.release_dir }}
          RELEASE_NOTES: ${{ steps.release.outputs.release_notes }}
        run: |
          set -eu
          release_title="$(node app/release-codenames.js "$RELEASE_TAG")"
          release_flags=()
          case "$RELEASE_TAG" in
            *-*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "$release_title" \
            --notes-file "$RELEASE_NOTES" \
            "${release_flags[@]}" \
            "$RELEASE_DIR"/*
